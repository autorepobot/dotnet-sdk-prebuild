# ============================================================
# Release
# ============================================================

  release:
    name: Publish Release
    needs:
      - build-x86
      - build-x64
      - build-x64-musl
      - build-arm64
      - build-arm64-musl
      - build-loong64
      - build-loong64-musl
      - build-riscv64
      - build-riscv64-musl
      - build-ppc64le

    runs-on: ubuntu-latest

    if: >
      always() &&
      inputs.release &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Make release
        run: |
          sdk_paths=$(find "${{ github.workspace }}/artifacts" -name 'dotnet-sdk-*.tar.gz')

          if [ -z "$sdk_paths" ]; then
            echo "No SDK artifacts found"
            exit 1
          fi

          artifacts=""
          tag_name=""

          for sdk_path in $sdk_paths; do
            sdk_filename=$(basename "$sdk_path")

            sdk_version=$(echo "$sdk_filename" | \
              sed -E 's/dotnet-sdk-([^-]+(-[^-]+)*)-linux-.+\.tar\.gz/\1/')

            artifacts="$artifacts \"$sdk_path\""
            tag_name="$sdk_version"
          done

          echo "tag_name: $tag_name"
          echo "artifacts: $artifacts"

          eval gh release create \
            "\"$tag_name\"" \
            $artifacts \
            --repo "\"${{ github.repository }}\"" \
            --target "\"${{ github.sha }}\"" \
            --title "\"$tag_name\"" \
            --notes "\"$tag_name\"" \
            $([ "${{ inputs.branding }}" = "release" ] || echo "--prerelease")
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Create failed tag
        if: failure() && inputs.branch != 'main'
        run: |
          tag_name="${{ inputs.branch }}.${{ github.run_id }}.failed"

          echo "tag_name: $tag_name"

          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/$tag_name" \
            -f sha="${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
