name: Build .NET SDK

run-name: "Build .NET SDK : ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet

      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main

      branding:
        description: 'SDK branding'
        required: true
        type: choice
        options:
          - unstable
          - preview
          - release
        default: preview

      release:
        description: 'publish release'
        type: boolean


# ============================================================
# x86
# ============================================================

jobs:

  build-x86:
    name: Build linux-x86
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-cached-tools: 'true'

      - name: Clone repository
        run: |
          git clone --single-branch --depth 1 \
            -b ${{ inputs.branch }} \
            https://github.com/${{ inputs.fork }}/dotnet

      - name: Prepare x86 RID patch
        run: |
          cat > "${{ github.workspace }}/patch-x86-sdk.py" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          if not path.is_file():
              raise SystemExit(2)

          text = path.read_text()
          old = text

          def add_attr_to_known_blocks(text, marker, attr):
              start = 0
              changed = False

              while True:
                  start = text.find(marker, start)
                  if start == -1:
                      break

                  end = text.find("/>", start)
                  if end == -1:
                      break

                  block = text[start:end]
                  attr_pos = block.find(attr)

                  if attr_pos != -1:
                      value_start = attr_pos + len(attr)
                      value_end = block.find('"', value_start)

                      if value_end != -1:
                          value = block[value_start:value_end]
                          values = value.split(";")

                          if "linux-x86" not in values:
                              value += ";linux-x86"

                              block = (
                                  block[:value_start]
                                  + value
                                  + block[value_end:]
                              )

                              text = (
                                  text[:start]
                                  + block
                                  + text[end:]
                              )

                              end = start + len(block)
                              changed = True

                  start = end + 2

              return text, changed

          changed = False

          for framework in (
              "Microsoft.NETCore.App",
              "Microsoft.AspNetCore.App",
          ):
              text, block_changed = add_attr_to_known_blocks(
                  text,
                  f'<KnownFrameworkReference Include="{framework}"',
                  'RuntimePackRuntimeIdentifiers="',
              )
              changed |= block_changed

          text, block_changed = add_attr_to_known_blocks(
              text,
              "<KnownAppHostPack",
              'AppHostRuntimeIdentifiers="',
          )
          changed |= block_changed

          if changed:
              path.write_text(text)
              print(f"[RID PATCH] Patched {path}")
              raise SystemExit(0)

          required = [
              'RuntimePackRuntimeIdentifiers="',
              'AppHostRuntimeIdentifiers="',
          ]

          if all(
              attr in text and "linux-x86" in text[text.find(attr):]
              for attr in required
          ):
              print(f"[RID PATCH] Already patched {path}")
              raise SystemExit(0)

          raise SystemExit(1)
          PY

      - name: Build
        run: |
          major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

          branding_arg=""
          if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
            branding_arg="--branding ${{ inputs.branding }}"
          fi

          echo "Major version: $major_version"
          echo "Branding argument: $branding_arg"

          docker run \
            --platform linux/amd64 \
            --rm \
            -v "${{ github.workspace }}/dotnet:/dotnet" \
            -v "${{ github.workspace }}/patch-x86-sdk.py:/patch-x86-sdk.py:ro" \
            -w /dotnet \
            -e ROOTFS_DIR=/crossrootfs/x86 \
            mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-x86 \
            bash -c '
              set -e

              (
                while true; do
                  for sdk_props in /dotnet/.dotnet/sdk/*/Microsoft.NETCoreSdk.BundledVersions.props; do
                    if [[ -f "$sdk_props" ]]; then
                      if python3 /patch-x86-sdk.py "$sdk_props"; then
                        exit 0
                      fi
                    fi
                  done

                  sleep 1
                done
              ) &

              patch_pid=$!

              trap "kill $patch_pid 2>/dev/null || true" EXIT

              ./build.sh \
                --clean-while-building \
                --prep \
                -sb \
                --os linux \
                --rid linux-x86 \
                --arch x86 \
                --use-mono-runtime \
                '"$branding_arg"' \
                -p:OfficialBuildId=$(date +%Y%m%d).99
            '

      - name: List assets directory
        run: |
          find "${{ github.workspace }}/dotnet/artifacts"

      - name: Upload .NET
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-linux-x86
          path: |
            ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz


# ============================================================
# x64
# ============================================================

  build-x64:
    name: Build linux-x64
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-cached-tools: 'true'

      - name: Clone repository
        run: |
          git clone --single-branch --depth 1 \
            -b ${{ inputs.branch }} \
            https://github.com/${{ inputs.fork }}/dotnet

      - name: Build
        run: |
          major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

          branding_arg=""
          if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
            branding_arg="--branding ${{ inputs.branding }}"
          fi

          echo "Major version: $major_version"
          echo "Branding argument: $branding_arg"

          docker run \
            --platform linux/amd64 \
            --rm \
            -v "${{ github.workspace }}/dotnet:/dotnet" \
            -w /dotnet \
            -e ROOTFS_DIR=/crossrootfs/x64 \
            mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64 \
            bash -c '
              set -e

              python3 /dotnet/src/runtime/eng/common/cross/install-debs.py \
                --arch amd64 \
                --rootfsdir "$ROOTFS_DIR" \
                --mirror https://old-releases.ubuntu.com/ubuntu/ \
                --suite bionic \
                --suite bionic-updates \
                --suite bionic-security \
                libssl-dev

              ./build.sh \
                --clean-while-building \
                --prep \
                -sb \
                --os linux \
                --rid linux-x64 \
                --arch x64 \
                '"$branding_arg"' \
                -p:OfficialBuildId=$(date +%Y%m%d).99
            '

      - name: List assets directory
        run: |
          find "${{ github.workspace }}/dotnet/artifacts"

      - name: Upload .NET
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-linux-x64
          path: |
            ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz


  build-x64-musl:
    name: Build linux-musl-x64
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-cached-tools: 'true'

      - name: Clone repository
        run: |
          git clone --single-branch --depth 1 \
            -b ${{ inputs.branch }} \
            https://github.com/${{ inputs.fork }}/dotnet

      - name: Build
        run: |
          major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

          branding_arg=""
          if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
            branding_arg="--branding ${{ inputs.branding }}"
          fi

          echo "Major version: $major_version"
          echo "Branding argument: $branding_arg"

          docker run \
            --platform linux/amd64 \
            --rm \
            -v "${{ github.workspace }}/dotnet:/dotnet" \
            -w /dotnet \
            -e ROOTFS_DIR=/crossrootfs/x64 \
            mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64-musl \
            bash -c '
              set -e

              apk.static --root "$ROOTFS_DIR" --initdb add openssl-dev

              ./build.sh \
                --clean-while-building \
                --prep \
                -sb \
                --os linux-musl \
                --rid linux-musl-x64 \
                --arch x64 \
                '"$branding_arg"' \
                -p:OfficialBuildId=$(date +%Y%m%d).99
            '

      - name: List assets directory
        run: |
          find "${{ github.workspace }}/dotnet/artifacts"

      - name: Upload .NET
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-linux-musl-x64
          path: |
            ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz


